name: hri-harvesting
problem_type: regression

data_source:
  type: hri_csv
  path: /data/simulation_all.csv

# En modo multi_slot el campo model.family se ignora — el torneo usa
# los candidatos de multi_slot.tournament_candidates.
model:
  family: tournament
  params: {}

multi_slot:
  scenarios:
    0: HumanOnly
    1: WithRobot
  targets:
    TotalRecollected: TotalRecollectedCrops_crop_units
    CargoZoneProd:    TotalProductionCargoZone_crop_units
    TotalWorkload:    TotalHumanWorkload_kcal
    AvgProduction:    AverageHumanProduction_crop_units
  feature_names:
    - Humans
    - ROW_N
    - RandomPosition
    - Act_Ladder
    - Act_Mixed
    - Act_Picker
  tournament_candidates:
    - linear_regression
    - ridge
    - lasso
    - elastic_net
    - svr
    - extra_trees_regressor
    - random_forest_regressor
    - gradient_boosting_regressor
    - mlp_regressor
    - xgboost_regressor
    - lightgbm_regressor
    - catboost_regressor

training:
  test_size: 0.20
  stratify: false
  cv_folds: 5

mlflow:
  experiment_name: hri-harvesting
  registered_model_name: "hri-{scenario}-{target}"  # expandido por train.py

quality_gates:
  min_r2: 0.70
  max_smape: 20.0
  max_latency_ms: 500

drift:
  data_drift_method: ks
  data_drift_p_value: 0.05
  concept_drift_p_value: 0.05
  performance:
    enabled: true
    effect_size_threshold: 0.05
    p_value_threshold: 0.05
    consecutive_windows: 2

retrain:
  challenger_min_improvement: 0.0
