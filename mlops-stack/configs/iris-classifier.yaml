name: iris-classifier
problem_type: classification

data_source:
  type: sklearn_dataset
  name: iris

model:
  family: random_forest_classifier
  params:
    n_estimators: 200
    max_depth: 8
    min_samples_split: 4
    min_samples_leaf: 2
    class_weight: balanced
    random_state: 42

training:
  test_size: 0.25
  stratify: true
  cv_folds: 5

mlflow:
  experiment_name: iris-production
  registered_model_name: iris-classifier

quality_gates:
  min_accuracy: 0.90
  min_f1: 0.90
  min_per_class_recall: 0.80
  max_cv_std: 0.05

drift:
  data_drift_method: ks
  data_drift_p_value: 0.05
  concept_drift_p_value: 0.05
  performance:
    enabled: true
    effect_size_threshold: 0.05
    p_value_threshold: 0.05
    consecutive_windows: 2

retrain:
  challenger_min_improvement: 0.0
