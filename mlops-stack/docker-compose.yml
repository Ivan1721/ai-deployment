# Cambios vs versión anterior:
# - Contexto de build cambiado a "." (mlops-stack/) para que los Dockerfiles
#   puedan copiar mlops_common/ y configs/ desde el directorio raíz del stack.
# - MODEL_CONFIG añadido a todos los servicios: apunta a configs/hri-harvesting.yaml.
#   Cambiar este valor a iris-classifier.yaml para usar el caso de clasificación.
# - restart: unless-stopped para que los servicios persistan entre reboots.

networks:
  mlops-net:
    driver: bridge

volumes:
  mlflow-data:    # artefactos MLflow — persiste entre deploys y reboots
  postgres-data:  # backend de MLflow (metadata de runs, modelos, parámetros)
  keycloak-data:  # datos persistentes de Keycloak (SSO browser auth)

services:

  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mlflow
      POSTGRES_USER:     mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow", "-d", "mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops-net

  mlflow:
    build: ./mlflow
    container_name: mlflow-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"       # localhost-only: no exponer a la red pública
    environment:
      POSTGRES_URI: postgresql://mlflow:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/mlflow
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - mlops-net

  model-trainer:
    build:
      context: .
      dockerfile: model-trainer/Dockerfile
    container_name: model-trainer
    environment:
      MLFLOW_TRACKING_URI:  http://mlflow:5001
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
      MODEL_CONFIG:         /app/configs/hri-harvesting.yaml
      DATASET_PATH:         /data/simulation_all.csv
    volumes:
      - mlflow-data:/mlflow
      - ./data:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-net

  inference-api:
    build:
      context: .
      dockerfile: inference-api/Dockerfile
    container_name: inference-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"       # localhost-only: acceso público solo vía nginx
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MODEL_STAGE:         Production
      MODEL_CONFIG:        /app/configs/hri-harvesting.yaml
      DATASET_PATH:        /data/simulation_all.csv
      API_KEY:             ${API_KEY:-}
    volumes:
      - mlflow-data:/mlflow
      - ./data:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - mlops-net

  drift-detector:
    build:
      context: .
      dockerfile: drift-detector/Dockerfile
    container_name: drift-detector
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI:       http://mlflow:5001
      INFERENCE_API_URL:         http://inference-api:8000
      MODEL_CONFIG:              /app/configs/hri-harvesting.yaml
      DATASET_PATH:              /data/simulation_all.csv
      KS_P_VALUE_THRESHOLD:      "0.05"
      CONSECUTIVE_DRIFT_WINDOWS: "2"
      WINDOW_SIZE:               "30"
      CHECK_INTERVAL_S:          "30"
      ENABLE_PERFORMANCE_DRIFT:  "true"
      PERF_DRIFT_EFFECT_SIZE:    "0.05"
      PERF_DRIFT_P_VALUE:        "0.05"
      PERF_DRIFT_CONSECUTIVE:    "2"
      API_KEY:                   ${API_KEY:-}
    volumes:
      - mlflow-data:/mlflow
      - ./data:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-net

  # test-runner: sin restart — se ejecuta manualmente o desde CI
  test-runner:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: test-runner
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
      INFERENCE_API_URL:   http://inference-api:8000
      MODEL_STAGE:         Production
      MODEL_CONFIG:        /app/configs/hri-harvesting.yaml
      DATASET_PATH:        /data/simulation_all.csv
      GATE_MIN_R2:         "0.70"
      GATE_MAX_SMAPE:      "20.0"
      GATE_MAX_LATENCY_MS: "500"
      API_KEY:             ${API_KEY:-}
    volumes:
      - mlflow-data:/mlflow
      - ./data:/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - mlops-net

  nginx:
    build: ./nginx
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mlflow
      - inference-api
    networks:
      - mlops-net

  # Keycloak — SSO para acceso browser a MLflow UI
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: h2
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "127.0.0.1:8080:8080"       # localhost-only
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 20

  # OAuth2 Proxy — protege MLflow UI con autenticación Keycloak
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
    container_name: oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER:              oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
      OAUTH2_PROXY_OIDC_ISSUER_URL:       http://keycloak:8080/realms/mlops
      OAUTH2_PROXY_CLIENT_ID:             mlops-client
      OAUTH2_PROXY_CLIENT_SECRET:         ${OAUTH2_CLIENT_SECRET:-mlops-client-secret}
      OAUTH2_PROXY_REDIRECT_URL:          https://localhost/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET:         ${OAUTH2_COOKIE_SECRET:-change-me-32-chars-minimum!!}
      OAUTH2_PROXY_COOKIE_SECURE:         "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY:       "true"
      OAUTH2_PROXY_COOKIE_SAMESITE:       "Strict"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON:  "true"
      OAUTH2_PROXY_HTTP_ADDRESS:          0.0.0.0:4180
      OAUTH2_PROXY_SKIP_AUTH_PATHS:       "^/oauth2/.*"
    ports:
      - "127.0.0.1:4180:4180"       # localhost-only
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
