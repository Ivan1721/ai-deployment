events { worker_connections 1024; }

http {
    upstream mlflow    { server mlflow:5001; }
    upstream inference { server inference-api:8000; }
    upstream oauth2    { server oauth2-proxy:4180; }

    # Redirect all HTTP → HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # OAuth2 Proxy endpoints (Keycloak SSO for browser auth)
        location /oauth2/ {
            proxy_pass       http://oauth2;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /oauth2/auth {
            proxy_pass              http://oauth2;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        location /mlflow/ {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_signin;
            proxy_pass         http://mlflow/;
            proxy_set_header   Host $host;
            proxy_read_timeout 300s;
        }

        location @oauth2_signin {
            return 302 /oauth2/sign_in?rd=https://$host$request_uri;
        }

        location /api/ {
            proxy_pass       http://inference/;
            proxy_set_header Host      $host;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location /grafana/ {
            proxy_pass         http://grafana:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
